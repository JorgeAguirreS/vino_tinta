name: Deploy Vino Tinta

on:
  workflow_run:
    workflows:
      - "Build Vino Tinta Image"
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            echo "=== INICIANDO DEPLOY ==="

            cd /home/azureuser/gitops

            echo "=== DESCARGANDO NUEVA IMAGEN ==="
            docker pull ghcr.io/jorgeaguirres/vino-tinta:latest

            echo "=== ACTUALIZANDO CONTENEDORES ==="
            docker compose \
              --project-name vinotinta \
              -f /home/azureuser/gitops/docker-compose.yml \
              up -d

            echo "=== EJECUTANDO MIGRACIONES ==="
            docker exec vinotinta-backend-1 \
              bench --site vinotinta.local migrate

            echo "=== VERIFICANDO APPS ==="
            docker exec vinotinta-backend-1 \
              bench --site vinotinta.local list-apps

            echo "=== CONTENEDORES ==="
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

            echo "=== DEPLOY FINALIZADO ==="
