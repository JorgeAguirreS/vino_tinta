name: Deploy Vino Tinta

on:
  workflow_run:
    workflows:
      - "Build Vino Tinta Image"
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            echo "=== INICIANDO DEPLOY ==="

            cd /home/azureuser/gitops

            echo "=== GUARDANDO IMAGEN ACTUAL ==="
            OLD_IMAGE=$(docker inspect vinotinta-backend-1 \
              --format='{{.Image}}')

            echo "Imagen anterior: $OLD_IMAGE"

            echo "=== BACKUP DEL SITIO ==="
            docker exec vinotinta-backend-1 \
              bench --site vinotinta.local backup

            echo "=== DESCARGANDO NUEVA IMAGEN ==="
            docker pull ghcr.io/jorgeaguirres/vino-tinta:latest

            echo "=== ACTUALIZANDO CONTENEDORES ==="
            docker compose \
              --project-name vinotinta \
              -f /home/azureuser/gitops/docker-compose.yml \
              up -d

            echo "=== ESPERANDO SERVICIOS ==="
            sleep 15

            echo "=== EJECUTANDO MIGRACIONES ==="
            docker exec vinotinta-backend-1 \
              bench --site vinotinta.local migrate

            echo "=== VERIFICANDO APPS ==="
            docker exec vinotinta-backend-1 \
              bench --site vinotinta.local list-apps

            echo "=== HEALTH CHECK ==="

            if curl --fail --silent --show-error \
              http://127.0.0.1:8080 > /dev/null; then

              echo "ERPNext responde correctamente"

            else

              echo "HEALTH CHECK FALLÓ"
              echo "=== INICIANDO ROLLBACK ==="

              docker tag "$OLD_IMAGE" \
                ghcr.io/jorgeaguirres/vino-tinta:latest

              docker compose \
                --project-name vinotinta \
                -f /home/azureuser/gitops/docker-compose.yml \
                up -d --force-recreate

              echo "=== ROLLBACK COMPLETADO ==="

              exit 1
            fi

            echo "=== CONTENEDORES ==="
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

            echo "=== DEPLOY FINALIZADO ==="
